name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env: {POSTGRES_USER: daily, POSTGRES_PASSWORD: daily_local, POSTGRES_DB: daily_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U daily -d daily_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache-dependency-path: backend/go.sum}
      - run: test -z "$(gofmt -l cmd internal)"
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go test -race -count=1 ./...
        working-directory: backend
        env: {TEST_DATABASE_URL: 'postgres://daily:daily_local@localhost:5432/daily_test?sslmode=disable'}
      - run: go build ./cmd/server
        working-directory: backend
      - run: docker run --rm -v "$PWD/backend:/src" -w /src sqlc/sqlc:1.31.1 generate && git diff --exit-code -- backend/internal/repository/db
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0'}
      - run: docker compose up --build -d --wait
      - run: npm ci && npx playwright install --with-deps chromium && npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-results, path: 'frontend/test-results/'}
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
