server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 110m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
 location = /docs { proxy_pass http://backend:8080; }
 location = /openapi.yaml { proxy_pass http://backend:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
